<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Governed rule data flow</title>
  <desc id="desc">A lead-time rule table feeds a resolved view consumed by reports. The application reads the resolved view and writes governed rule changes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#086b58"/></marker></defs>
  <rect width="1000" height="380" rx="18" fill="#f4f3ee"/>
  <g font-family="ui-monospace, monospace" text-anchor="middle" fill="#182522">
    <g font-size="16" font-weight="700">
      <rect x="70" y="142" width="205" height="82" rx="10" fill="#fffefa" stroke="#aeb9b1"/><text x="172" y="175">LeadTimeRule</text><text x="172" y="198" font-size="12">owner · scope · provenance</text>
      <rect x="400" y="142" width="205" height="82" rx="10" fill="#d9eee6" stroke="#086b58" stroke-width="2"/><text x="502" y="175">vw_ResolvedLeadTime</text><text x="502" y="198" font-size="12">one resolved answer</text>
      <rect x="735" y="142" width="190" height="82" rx="10" fill="#fffefa" stroke="#aeb9b1"/><text x="830" y="175">Reports</text><text x="830" y="198" font-size="12">shared rule output</text>
    </g>
    <path d="M275 183h115M605 183h120" stroke="#086b58" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="400" y="285" width="205" height="58" rx="10" fill="#e5eef5" stroke="#317ba0"/><text x="502" y="320" font-size="14" font-weight="700">Setup application</text>
    <path d="M465 285v-48" stroke="#317ba0" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
    <path d="M538 238v40" stroke="#317ba0" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
    <text x="530" y="365" font-size="12" fill="#58655f">App reads the resolved view and writes rules; SQL owns the decision.</text>
  </g>
</svg>
