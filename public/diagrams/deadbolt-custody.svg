<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Tamper-evident transmission custody chain</title>
  <desc id="desc">A private EDI document is captured and hashed, its custody record is anchored to a public timechain, and an independent verifier checks the proof without exposing document content.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#086b58"/></marker></defs>
  <rect width="1000" height="360" rx="18" fill="#f4f3ee"/>
  <g font-family="ui-monospace, monospace" text-anchor="middle" fill="#182522">
    <g font-size="15" font-weight="700">
      <rect x="35" y="125" width="150" height="82" rx="10" fill="#fffefa" stroke="#aeb9b1"/><text x="110" y="159">Private EDI</text><text x="110" y="182" font-size="12">document bytes</text>
      <rect x="235" y="125" width="160" height="82" rx="10" fill="#fffefa" stroke="#aeb9b1"/><text x="315" y="159">Capture + hash</text><text x="315" y="182" font-size="12">exact content commitment</text>
      <rect x="445" y="125" width="165" height="82" rx="10" fill="#d9eee6" stroke="#086b58" stroke-width="2"/><text x="527" y="159">Custody record</text><text x="527" y="182" font-size="12">time · sender · digest</text>
      <rect x="665" y="125" width="145" height="82" rx="10" fill="#eee9f7" stroke="#635293"/><text x="737" y="159">Public anchor</text><text x="737" y="182" font-size="12">timechain proof</text>
      <rect x="855" y="125" width="110" height="82" rx="10" fill="#fffefa" stroke="#aeb9b1"/><text x="910" y="159">Verify</text><text x="910" y="182" font-size="12">independent</text>
    </g>
    <g stroke="#086b58" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M185 166h44"/><path d="M395 166h44"/><path d="M610 166h49"/><path d="M810 166h39"/></g>
    <text x="500" y="280" font-size="13" fill="#58655f">Proves a committed document existed by the anchor time—not that a receiver processed it.</text>
  </g>
</svg>
